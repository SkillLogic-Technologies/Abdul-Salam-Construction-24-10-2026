    <!-- Hero image-sequence first frame — the canvas in Hero.tsx draws 15
         PNG frames (public/frames/f01.png...f015.png) loaded via `new
         Image()` once React mounts, but the browser's preload scanner can't
         see that fetch until the JS bundle has been downloaded, parsed, and
         run. Preloading just f01.png (the frame painted the instant the
         hero appears, before any scroll input) closes that gap so the very
         first paint doesn't wait behind the JS parse/execute step — this is
         the one frame that actually gates first paint; frames 2-15 are only
         needed once the visitor starts scrolling, which is already well
         after JS has taken over and started the normal eager Image() loads
         in Hero.tsx. fetchpriority="high" lets it compete against the
         Google Fonts requests below for bandwidth instead of queuing behind
         them. Left as a normal (non-`type`) image preload since it's
         consumed via Image()/canvas, not decoded as a document resource. -->
    <link rel="preload" as="image" href="/frames/f01.png" fetchpriority="high" />
